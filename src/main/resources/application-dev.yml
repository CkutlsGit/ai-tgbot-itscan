spring:
  application:
    name: itscantgbot

  ai:
    openai:
      api-key: apikey
      base-url: http://host.docker.internal:1234/v1
      timeout: 200s
      chat:
        model: qwen/qwen3-8b
      embedding:
        options:
          model: text-embedding-nomic-embed-text-v1.5
    prompt-path: classpath:prompts/system-prompt.txt

  datasource:
    jdbc-url: jdbc:postgresql://postgres-user:5432/itscan-user
    username: postgres
    password: postgres123

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

telegram:
  bot:
    token: ${TOKEN_BOT}
    base-count-request: 3
    base-answer-request: "Не удалось получить ответ"
    base-start-message: "Привет! Я IT-Scann, бот который даст ответы на твои вопросы связанные с IT. Чтобы спросить вопрос напиши /ask"

parser:
  init-delay: 25000
  fixed-rate: 43200000

rag:
  top-k: 5
  similarity-threshold: 0.7
  chunk-size: 500
  min-chunk-size: 100
  min-chunk-size-length-embed: 50
  max-chunk-size: 1000
  keep-separator: true
  embed-dimensions: 768

vector:
  datasource:
    jdbc-url: jdbc:postgresql://pgvector-itscan:5432/itscan-article
    username: pgvector
    password: pgvector123