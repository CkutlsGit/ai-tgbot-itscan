spring:
  application:
    name: itscantgbot

  ai:
    openai:
      api-key: apikey
      base-url: http://host.docker.internal:1234/v1
      timeout: 200s
      chat:
        model: qwen/qwen3-8b
      embedding:
        options:
          model: text-embedding-nomic-embed-text-v1.5
    prompt-path: classpath:prompts/system-prompt.txt

  datasource:
    jdbc-url: ${POSTGRES_DB_URL}
    username: ${POSTGRES_DB_USERNAME}
    password: ${POSTGRES_DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

telegram:
  bot:
    token: ${TOKEN_BOT}
    base-count-request: 3
    base-answer-request: "Не удалось получить ответ"
    base-start-message: "Привет! Я IT-Scann, бот который даст ответы на твои вопросы связанные с IT. Чтобы спросить вопрос напиши /ask"

parser:
  init-delay: 25000
  fixed-rate: 43200000

rag:
  top-k: 5
  similarity-threshold: 0.7


vector:
  datasource:
    jdbc-url: ${PGVECTOR_DB_URL}
    username: ${PGVECTOR_DB_USERNAME}
    password: ${PGVECTOR_DB_PASSWORD}