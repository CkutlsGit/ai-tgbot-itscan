spring.application.name=itscantgbot

spring.ai.openai.api-key=apikey
spring.ai.openai.base-url=http://127.0.0.1:1234/v1
spring.ai.openai.chat.model=qwen/qwen3-1.7b

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
spring.ai.vectorstore.pgvector.dimensions=768