spring.application.name=itscantgbot
#spring.config.import=file:.env[.properties]

telegram.bot.token=${TOKEN_BOT}

spring.ai.openai.api-key=apikey
spring.ai.openai.base-url=http://host.docker.internal:1234/v1
spring.ai.openai.chat.model=qwen/qwen3-8b
spring.ai.openai.timeout=200s

spring.datasource.hikari.jdbc-url=jdbc:postgresql://postgres-user:5432/itscan-user
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

vector.datasource.jdbc-url=jdbc:postgresql://pgvector-itscan:5432/itscan-article
vector.datasource.username=pgvector
vector.datasource.password=pgvector123
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.openai.embedding.options.model=text-embedding-nomic-embed-text-v1.5
spring.ai.vectorstore.pgvector.dimensions=768