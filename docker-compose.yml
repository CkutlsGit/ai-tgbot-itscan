services:
  postgres-user:
    container_name: postgres-user
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=itscan-user
    volumes:
      - itscan-data-user:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
  pgvector-itscan:
    container_name: pgvector-itscan
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=pgvector
      - POSTGRES_PASSWORD=pgvector123
      - POSTGRES_DB=itscan-article
    volumes:
      - itscan-data-article:/var/lib/postgresql/data
    networks:
      - dbnet
    restart: always

  itscan:
    container_name: itscan
    build: .
    networks:
      - dbnet
    environment:
      - TOKEN_BOT=${TOKEN_BOT}
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

networks:
  dbnet:
    driver: bridge
volumes:
  itscan-data-user:
  itscan-data-article:

